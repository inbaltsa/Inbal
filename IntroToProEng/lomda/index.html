<title>מדידה והתאמת עקומות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Data-driven lomda engine. All text lives in content.js; this file is engine+style.
   One typeface throughout (Assistant). Committed light "paper" theme, green academic palette matching the source deck. */
:root{
  --paper:#fff; --bg:#eef1ea; --ink:#1f2a22; --muted:#5c6b5e;
  --green:#4e7d3a; --green-dark:#3a5f2b; --green-soft:#e8f0e0;
  --gold:#a9792a; --gold-soft:#f7efdc; --gold-line:#e4cf9f;
  --good:#2e7d32; --good-bg:#e7f4e7; --bad:#c0392b; --bad-bg:#fbeae7;
  --line:#d8e0d0; --shadow:0 1px 3px rgba(40,60,40,.08),0 6px 20px rgba(40,60,40,.06);
  --sans:'Assistant',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;direction:rtl;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green-dark);z-index:30}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green-dark);color:#fff}
.bar-in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar-title{font-weight:700;font-size:15px;white-space:nowrap}
.count{font-size:13px;color:#e4efda;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:6px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;flex:1 1 120px;min-width:110px}
.progress>i{display:block;height:100%;background:#bcd99f;width:0;transition:width .35s ease}
.bar-unit{font-size:13px;color:#cfe0c3;margin-inline-start:auto;white-space:nowrap}

main{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 112px}
.screen{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 24px;animation:fade .35s ease}
@media (prefers-reduced-motion:reduce){.screen,.msg{animation:none!important}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:520px){.screen{padding:20px 15px}}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--green);margin:0 0 2px}
h2{font-weight:800;letter-spacing:-.2px;font-size:clamp(23px,4.5vw,30px);line-height:1.2;margin:0 0 .5em;color:var(--green-dark);text-wrap:balance}
h3{font-size:18px;font-weight:700;margin:1.2em 0 .4em}
p{margin:.55em 0}
strong{color:var(--green-dark);font-weight:700}
.scene{background:var(--green-soft);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--green-dark);margin-bottom:14px}
.note{background:var(--green-soft);border-radius:10px;padding:12px 16px;font-size:15.5px;color:var(--green-dark);margin:12px 0}
.core{background:var(--green-soft);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:16px;color:var(--green-dark)}
.core.teal{background:#e3f1f3;color:#124}
ul.clean{list-style:none;padding:0;margin:.6em 0;display:flex;flex-direction:column;gap:10px}
ul.clean>li{position:relative;padding-inline-start:30px;min-width:0}
ul.clean>li::before{content:"";position:absolute;inset-inline-start:4px;top:.62em;width:9px;height:9px;border-radius:3px;background:var(--green);transform:rotate(45deg)}
figure{margin:16px 0;text-align:center}
figure img{max-width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
figcaption{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.4}
.eq{display:flex;justify-content:center;margin:14px 0}
.eq img{max-height:52px;width:auto;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 12px}
.wordmap{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.wordmap .w{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.wordmap .w b{font-size:17px}
.wordmap .w .gloss{color:var(--muted);font-size:14px}

/* chart */
.chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px 4px;margin:14px 0}
.chart svg{width:100%;height:auto;display:block}
.readout{text-align:center;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin:6px 0 2px;min-height:1.4em}
.readout b{color:var(--green-dark)}
.slider-wrap{margin:10px 4px 2px}
.slider-wrap label{font-size:14px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--green);margin-top:6px}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:8px 0 2px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-inline-end:5px}

/* dialogue */
.dialogue{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.msg{display:flex;gap:10px;align-items:flex-start;animation:fade .35s ease}
.msg.t{flex-direction:row-reverse}
.ava{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.msg.z .ava{background:var(--gold)}
.msg.t .ava{background:var(--green)}
.bubble{border-radius:14px;padding:10px 14px;max-width:80%;font-size:15.5px}
.msg.z .bubble{background:var(--gold-soft);border:1px solid var(--gold-line);border-top-right-radius:4px}
.msg.t .bubble{background:var(--green-soft);border:1px solid #cfe0bf;border-top-left-radius:4px}
.bubble .who{display:block;font-size:12px;font-weight:700;margin-bottom:2px;opacity:.8}
.msg.z .who{color:var(--gold)} .msg.t .who{color:var(--green-dark)}
.turnlabel{text-align:center;font-size:13px;font-weight:700;letter-spacing:.3px;color:var(--muted);margin:6px 0 -2px}

/* divider */
.divider{text-align:center}
.divider .num{font-size:clamp(60px,16vw,92px);line-height:1;color:var(--green-soft);font-weight:700}
.divider h2{color:var(--green-dark);margin-top:-.12em}
.divider .sub{color:var(--muted)}

/* questions */
.quiz{border:1.5px solid var(--line);border-radius:14px;padding:18px;margin:18px 0 4px;background:#fcfdfb}
.qtag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;margin-bottom:8px}
.qtag.practice{background:var(--gold-soft);color:var(--gold)}
.q{font-weight:600;margin:.1em 0 .7em}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{font-family:inherit;font-size:16px;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--green)}
.opt:focus-visible{outline:3px solid #bcd99f;outline-offset:2px}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{font-family:inherit;font-size:17px;width:130px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;text-align:center}
.numrow input:focus-visible{outline:3px solid #bcd99f;outline-offset:1px;border-color:var(--green)}
.numrow .unit{color:var(--muted);font-size:15px}
.check{font-family:inherit;font-size:15px;font-weight:700;background:var(--green);color:#fff;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;margin-top:12px}
.check:hover{background:var(--green-dark)}
.check:focus-visible{outline:3px solid #bcd99f;outline-offset:2px}
.check:disabled{background:var(--muted);cursor:default}
.fb{margin-top:12px;border-radius:10px;padding:11px 14px;font-size:15px;line-height:1.5}
.fb.ok{background:var(--good-bg);color:#1e5620;border:1px solid #bcdcbd}
.fb.no{background:var(--bad-bg);color:#8d2a1e;border:1px solid #e7bcb6}
.cards{display:flex;flex-direction:column;gap:10px;margin:4px 0 14px}
.card{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;font-size:15.5px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s}
.card:hover{border-color:var(--green)}
.card.picked{border-color:var(--green);background:var(--green-soft);box-shadow:0 0 0 2px #bcd99f inset}
.card.placed{opacity:.55;cursor:default}
.card .tag{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-top:4px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
@media (max-width:460px){.bins{grid-template-columns:1fr}}
.bin{border:2px dashed var(--line);border-radius:13px;padding:12px;min-height:120px}
.bin h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.bin.safe h4{color:var(--good)} .bin.care h4{color:var(--bad)}
.bin .mini{display:flex;flex-direction:column;gap:7px}
.bin .drop{font-size:13px;color:var(--muted);text-align:center;padding:14px 4px}
.chip{border-radius:9px;padding:8px 11px;font-size:14px;border:1px solid var(--line);background:#fafbf8}
.chip.ok{background:var(--good-bg);border-color:#bcdcbd}
.chip.no{background:var(--bad-bg);border-color:#e7bcb6}
.chip .v{font-weight:700;margin-inline-start:4px}
.qtag.graded{background:var(--green-soft);color:var(--green-dark)}
.figrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.figrow figure{margin:0}
@media (max-width:460px){.figrow{grid-template-columns:1fr}}
.scales{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.scale-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 6px 2px}
.scale-card .lab{font-size:13px;font-weight:700;color:var(--muted);text-align:center;margin:2px 0}
.scale-card svg{width:100%;height:auto;display:block}
.tree{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#fcfdfb}
.tree-q{font-weight:700;color:var(--green-dark);margin-bottom:10px}
.tree-branches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.tree-branches{grid-template-columns:1fr}}
.tree-branch{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.tree-a{font-weight:700}
.tree-m{color:var(--green-dark);margin-top:4px;font-size:15px}
.tree-subq{font-weight:700;color:var(--muted);font-size:14px;margin:8px 0 6px}
.tree-sub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding:6px 0;font-size:14px}
.tree-sub .tm{color:var(--green-dark);font-weight:600}
.tree-foot{margin-top:10px;font-size:14px;color:var(--muted);font-style:italic}
.examnote{background:var(--gold-soft)!important;color:var(--gold)!important;font-weight:600}
.result{text-align:center}
.score-ring{font-size:58px;font-weight:800;line-height:1;margin:6px 0}
.verdict{font-size:20px;font-weight:700;margin:.2em 0}
.verdict.pass{color:var(--good)} .verdict.fail{color:var(--bad)}
.lead{font-size:18px;color:var(--muted)}
.breakdown{text-align:start;max-width:520px;margin:18px auto 0;display:flex;flex-direction:column;gap:8px}
.breakdown .row{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px 12px;border-radius:9px;background:#fafbf8;border:1px solid var(--line)}
.breakdown .mark{font-weight:800}
.breakdown .row.c .mark{color:var(--good)} .breakdown .row.w .mark{color:var(--bad)}

.center{display:flex;justify-content:center;margin-top:16px}

nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;gap:12px;align-items:center}
.btn{font-family:inherit;font-size:16px;font-weight:700;border-radius:11px;padding:11px 22px;cursor:pointer;border:1.5px solid var(--green);background:#fff;color:var(--green-dark)}
.btn:hover{background:var(--green-soft)}
.btn:focus-visible{outline:3px solid #bcd99f;outline-offset:2px}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:hover{background:var(--green-dark)}
.btn:disabled{opacity:.4;cursor:default}
.reset{font-family:inherit;font-size:13px;background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:6px 4px}
.reset:hover{color:var(--green-dark)}
.reset:focus-visible{outline:3px solid #bcd99f;outline-offset:2px;border-radius:6px}
.prev{margin-inline-start:auto}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">

<header>
  <div class="bar-in">
    <span class="bar-title" id="barTitle">מדידה והתאמת עקומות</span>
    <span class="count" id="count"></span>
    <div class="progress"><i id="pbar"></i></div>
    <span class="bar-unit" id="act"></span>
  </div>
</header>

<main><div id="screenHost"></div></main>

<nav>
  <div class="nav-in">
    <button class="reset" id="resetBtn">↻ התחלה מחדש</button>
    <button class="btn prev" id="prevBtn" hidden>▸ הקודם</button>
    <button class="btn primary" id="nextBtn" hidden>הבא ◂</button>
  </div>
</nav>

<script src="content.js"></script>
<script>
/* ===================== calibration chart ===================== */
var W=460,H=300,pL=52,pR=18,pT=18,pB=46,pRight=W-pR,pBottom=H-pB,pW=pRight-pL,pH=pBottom-pT;
function X(c){return pL+(c/14)*pW;}
function Y(a){return pBottom-(a/1.4)*pH;}
var DATA=[[2,0.21],[4,0.39],[6,0.60],[8,0.82],[10,0.99]];
var TRUE=[[0.5,0.04],[1,0.08],[1.5,0.13],[2,0.21],[4,0.39],[6,0.60],[8,0.82],[10,0.99],[11,1.03],[12,1.07],[13,1.11],[14,1.15]];
function cAxis(){var s='';
  s+='<line x1="'+pL+'" y1="'+pBottom+'" x2="'+pRight+'" y2="'+pBottom+'" stroke="#b9c4ad" stroke-width="1.5"/>';
  s+='<line x1="'+pL+'" y1="'+pT+'" x2="'+pL+'" y2="'+pBottom+'" stroke="#b9c4ad" stroke-width="1.5"/>';
  for(var c=2;c<=14;c+=2){s+='<line x1="'+X(c)+'" y1="'+pBottom+'" x2="'+X(c)+'" y2="'+(pBottom+4)+'" stroke="#b9c4ad"/><text x="'+X(c)+'" y="'+(pBottom+17)+'" text-anchor="middle" font-family="Assistant,sans-serif" font-size="11" fill="#5c6b5e">'+c+'</text>';}
  for(var a=0.2;a<=1.401;a+=0.2){var ya=Y(a);s+='<line x1="'+(pL-4)+'" y1="'+ya+'" x2="'+pL+'" y2="'+ya+'" stroke="#b9c4ad"/><text x="'+(pL-7)+'" y="'+(ya+4)+'" text-anchor="end" font-family="Assistant,sans-serif" font-size="11" fill="#5c6b5e">'+a.toFixed(1)+'</text>';}
  s+='<text x="'+((pL+pRight)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-family="Assistant,sans-serif" font-size="12" fill="#1f2a22">ריכוז C</text>';
  s+='<text transform="translate(14,'+((pT+pBottom)/2)+') rotate(-90)" text-anchor="middle" font-family="Assistant,sans-serif" font-size="12" fill="#1f2a22">בליעה A</text>';
  return s;}
function cLine(){return '<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(10)+'" y2="'+Y(1.0)+'" stroke="#4e7d3a" stroke-width="2.4"/><line x1="'+X(10)+'" y1="'+Y(1.0)+'" x2="'+X(14)+'" y2="'+Y(1.4)+'" stroke="#4e7d3a" stroke-width="2" stroke-dasharray="5 4" opacity="0.6"/>';}
function cSeg(){var a=DATA[0],b=DATA[1];return '<line x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'" stroke="#4e7d3a" stroke-width="2.8" stroke-linecap="round"/>';}
function cAllSeg(){return '<polyline points="'+DATA.map(function(d){return X(d[0])+','+Y(d[1]);}).join(' ')+'" fill="none" stroke="#4e7d3a" stroke-width="2.4" stroke-linejoin="round"/>';}
function cFit(p1,p2,color){var m=(p2[1]-p1[1])/(p2[0]-p1[0]),b=p1[1]-m*p1[0];return '<line x1="'+X(0)+'" y1="'+Y(b)+'" x2="'+X(14)+'" y2="'+Y(m*14+b)+'" stroke="'+color+'" stroke-width="2.2" opacity=".9"/>';}
var NOISY=[[1,0.16],[2,0.13],[3,0.42],[4,0.31],[5,0.59],[6,0.48],[7,0.80],[8,0.63],[9,0.98],[10,0.86]];
function miniChart(pts,col){var s='<svg viewBox="0 0 460 300" style="width:100%;height:auto"><rect width="460" height="300" fill="#fff"/>'+cAxis()+'<line x1="'+X(0)+'" y1="'+Y(0)+'" x2="'+X(10)+'" y2="'+Y(1.0)+'" stroke="#4e7d3a" stroke-width="2.4"/>';pts.forEach(function(d){s+='<circle cx="'+X(d[0])+'" cy="'+Y(d[1])+'" r="4.5" fill="'+col+'" stroke="#fff" stroke-width="1.2"/>';});return s+'</svg>';}
function cPoints(){var s='';DATA.forEach(function(d){s+='<circle cx="'+X(d[0])+'" cy="'+Y(d[1])+'" r="4.5" fill="#3a5f2b" stroke="#fff" stroke-width="1.2"/>';});return s;}
function cZones(){var s='<defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="rgba(192,57,43,.25)" stroke-width="1.4"/></pattern></defs>';
  s+='<rect x="'+X(2)+'" y="'+pT+'" width="'+(X(10)-X(2))+'" height="'+pH+'" fill="rgba(78,125,58,.14)"/>';
  s+='<rect x="'+pL+'" y="'+pT+'" width="'+(X(2)-pL)+'" height="'+pH+'" fill="rgba(192,57,43,.09)"/>';
  s+='<rect x="'+X(10)+'" y="'+pT+'" width="'+(pRight-X(10))+'" height="'+pH+'" fill="url(#hatch)"/>';return s;}
function cMarker(c,a,col,lbl){var x=X(c),y=Y(a);return '<line x1="'+pL+'" y1="'+y+'" x2="'+x+'" y2="'+y+'" stroke="'+col+'" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/><line x1="'+x+'" y1="'+pBottom+'" x2="'+x+'" y2="'+y+'" stroke="'+col+'" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/><circle cx="'+x+'" cy="'+y+'" r="5" fill="'+col+'" stroke="#fff" stroke-width="1.4"/><text x="'+x+'" y="'+(y-10)+'" text-anchor="middle" font-family="Assistant,sans-serif" font-weight="700" font-size="12.5" fill="'+col+'">'+lbl+'</text>';}
function cTrue(){var col='#1f7a8c',out=TRUE.filter(function(d){return d[0]>=10;});
  var path='M'+out.map(function(d){return X(d[0])+' '+Y(d[1]);}).join(' L ');
  var s='<path d="'+path+'" fill="none" stroke="'+col+'" stroke-width="2.2" stroke-dasharray="1 4" stroke-linecap="round" opacity=".85"/>';
  TRUE.forEach(function(d){s+='<circle cx="'+X(d[0])+'" cy="'+Y(d[1])+'" r="3.4" fill="'+col+'" opacity=".9"/>';});return s;}
/* vertical guides where the two fits are compared, with each fit's value marked */
function cFitReads(cs){var s='';cs.forEach(function(c){var az=0.0975*c+0.015,at=0.1075*c-0.04;
  s+='<line x1="'+X(c)+'" y1="'+pBottom+'" x2="'+X(c)+'" y2="'+pT+'" stroke="#1f2a22" stroke-width="1" stroke-dasharray="3 4" opacity=".45"/>';
  s+='<circle cx="'+X(c)+'" cy="'+Y(az)+'" r="4.5" fill="#a9792a" stroke="#fff" stroke-width="1.2"/><circle cx="'+X(c)+'" cy="'+Y(at)+'" r="4.5" fill="#2e7d32" stroke="#fff" stroke-width="1.2"/>';
  s+='<text x="'+(X(c)-6)+'" y="'+(pT+12)+'" text-anchor="end" font-family="Assistant,sans-serif" font-weight="700" font-size="12"><tspan fill="#1f2a22">C='+c+':</tspan><tspan x="'+(X(c)-6)+'" dy="15" fill="#a9792a">'+az.toFixed(2)+'</tspan><tspan x="'+(X(c)-6)+'" dy="15" fill="#2e7d32">'+at.toFixed(2)+'</tspan></text>';});return s;}
function cDraw(o){o=o||{};var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="גרף כיול: בליעה מול ריכוז">';

var SCORM=(function(){
  var api=null,found=false,startMs=Date.now();
  function find(w){var n=0;while(w&&n<12){try{if(w.API)return w.API;}catch(e){return null;}var pp;try{pp=w.parent;}catch(e){return null;}if(pp&&pp!==w){w=pp;n++;}else break;}return null;}
  function ts(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;function p(n){return(n<10?'0':'')+n;}return p(h)+':'+p(m)+':'+p(ss);}
  return {
    get live(){return found;},
    init:function(){try{api=find(window);if(!api){var op=null;try{op=window.opener;}catch(e){}if(op)api=find(op);}}catch(e){api=null;}if(!api)return false;try{found=(api.LMSInitialize('')+''==='true');if(found){var st=api.LMSGetValue('cmi.core.lesson_status');if(!st||st==='not attempted'||st===''){api.LMSSetValue('cmi.core.lesson_status','incomplete');}api.LMSCommit('');}}catch(e){found=false;}return found;},
    finish:function(score,passed){if(!found)return;try{api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','100');api.LMSSetValue('cmi.core.score.raw',String(score));api.LMSSetValue('cmi.core.lesson_status',passed?'passed':'failed');api.LMSSetValue('cmi.core.session_time',ts(Date.now()-startMs));api.LMSCommit('');}catch(e){}},
    quit:function(){if(found){try{api.LMSFinish('');}catch(e){}}}
  };
})();

function renderBlock(b,ctx,host){
  switch(b.t){
    case 'p': host.appendChild(el('p',null,b.html)); break;
    case 'scene': host.appendChild(el('div','scene',b.html)); break;
    case 'note': host.appendChild(el('div','note',b.html)); break;
    case 'core': host.appendChild(el('div','core',b.html)); break;
    case 'coreTeal': host.appendChild(el('div','core teal',b.html)); break;
    case 'list': var ul=el('ul','clean'); b.items.forEach(function(it){ul.appendChild(el('li',null,it));}); host.appendChild(ul); break;
    case 'eq': var f=el('figure','eq'); f.innerHTML='<img src="'+b.src+'" alt="'+(b.alt||'')+'">'; host.appendChild(f); break;
    case 'img': var fi=el('figure'); fi.innerHTML='<img src="'+b.src+'" alt="'+(b.alt||'')+'">'+(b.cap?'<figcaption>'+b.cap+'</figcaption>':''); host.appendChild(fi); break;
    case 'wordmap': var wm=el('div','wordmap'); b.items.forEach(function(w){wm.appendChild(el('div','w','<b>'+w.term+'</b> <span class="gloss">('+w.gloss+')</span><br>'+w.body));}); host.appendChild(wm); break;

    case 'dialogue': renderDialogue(b,ctx,host); break;

    case 'localInterp': host.appendChild(renderLocalInterp()); break;
    case 'figrow': var fr=el('div','figrow'); b.items.forEach(function(it){var f=el('figure');f.innerHTML='<img src="'+it.src+'" alt="'+(it.alt||'')+'">'+(it.cap?'<figcaption>'+it.cap+'</figcaption>':'');fr.appendChild(f);}); host.appendChild(fr); break;
    case 'comparefits': var frc=el('div','figrow');
      var fc1=el('figure'); fc1.innerHTML='<div class="chart" dir="ltr">'+miniChart(DATA,'#3a5f2b')+'</div><figcaption>נתונים נקיים — הנקודות כמעט על הקו</figcaption>';

      frc.appendChild(fc1); frc.appendChild(fc2); host.appendChild(frc); break;

    case 'decisionTree': host.appendChild(renderTree(b)); break;
  }

  });
  box.appendChild(binsEl);
  var chk=el('button','check','בדיקה'); chk.disabled=true; box.appendChild(chk);
  var fb=el('div','fb'); fb.hidden=true; box.appendChild(fb);
  var picked=null, placed={}, texts={}, total=q.cards.length;
  q.cards.forEach(function(c,i){var id='c'+i; texts[id]=c.text;
    var card=el('div','card',c.text+'<span class="tag">לחצו לבחירה</span>'); card.dataset.id=id; card.dataset.correct=c.correct;
    card.addEventListener('click',function(){if(card.classList.contains('placed'))return;if(picked===card){card.classList.remove('picked');picked=null;return;}pool.querySelectorAll('.card').forEach(function(x){x.classList.remove('picked');});card.classList.add('picked');picked=card;});
    pool.appendChild(card);
  });
  binsEl.querySelectorAll('.bin').forEach(function(bin){
    bin.addEventListener('click',function(){
      if(!picked)return; var id=picked.dataset.id; placed[id]=bin.dataset.bin;
      var mini=binMini[bin.dataset.bin], dh=mini.querySelector('.drop'); if(dh)dh.remove();
      var chip=el('div','chip',texts[id]); chip.dataset.id=id; mini.appendChild(chip);
      picked.classList.add('placed'); picked.classList.remove('picked'); picked.querySelector('.tag').textContent='✓ שובץ'; picked=null;
      chk.disabled=Object.keys(placed).length<total;
    });
  });
  chk.addEventListener('click',function(){
    var right=0;
    q.cards.forEach(function(c,i){var id='c'+i;var chip=box.querySelector('.chip[data-id="'+id+'"]');var ok=placed[id]===c.correct;if(ok)right++;chip.classList.add(ok?'ok':'no');chip.innerHTML=texts[id]+'<span class="v">'+(ok?'✓':'✗ — '+binLabel[c.correct])+'</span>';});
    fb.hidden=false;
    if(right===total){fb.className='fb ok';fb.textContent=q.fbOk;}else{fb.className='fb no';fb.textContent=q.fbNo.replace('{n}',right);}
    chk.disabled=true;if(onDone)onDone();
  });
}

function renderExam(s,hostEl){
  hostEl.appendChild(el('p','eyebrow',s.eyebrow||'מבחן מסכם'));
  hostEl.appendChild(el('h2',null,s.title||'מבחן מסכם'));
  if(s.intro) hostEl.appendChild(el('p',null,s.intro));
  var graders=[];
  s.questions.forEach(function(q,i){
    var box=el('div','quiz graded'); hostEl.appendChild(box);
    box.appendChild(el('span','qtag graded','שאלה '+(i+1)+' · נספרת'));
    box.appendChild(el('p','q',q.q));
    if(q.t==='numeric'){
      var row=el('div','numrow'),inp=document.createElement('input');inp.type='number';inp.step='any';inp.inputMode='decimal';inp.placeholder=q.placeholder||'';inp.setAttribute('aria-label','תשובה מספרית');
      row.appendChild(inp); if(q.unit)row.appendChild(el('span','unit',q.unit)); box.appendChild(row);
      graders.push({ans:function(){return inp.value!=='';},ok:function(){var v=parseFloat(inp.value);return !isNaN(v)&&Math.abs(v-q.answer)<=(q.tol||0.01);}});
    }else{
      var opts=el('div','opts'),picked={v:null};
      q.opts.forEach(function(o){var bt=el('button','opt',o.text);bt.dataset.k=o.k;bt.addEventListener('click',function(){opts.querySelectorAll('.opt').forEach(function(x){x.classList.remove('sel');});bt.classList.add('sel');picked.v=o.k;});opts.appendChild(bt);});
      box.appendChild(opts);
      graders.push({ans:function(){return picked.v!=null;},ok:function(){return picked.v===q.answer;}});
    }
  });
  var warn=el('div','fb no');warn.hidden=true;hostEl.appendChild(warn);
  var sub=el('button','check','שליחת המבחן');sub.style.fontSize='16px';hostEl.appendChild(sub);
  sub.addEventListener('click',function(){
    var un=graders.filter(function(g){return !g.ans();});
    if(un.length){warn.hidden=false;warn.textContent='נותרו '+un.length+' שאלות ללא מענה. ענו על כולן לפני השליחה.';return;}
    var rows=graders.map(function(g){return g.ok();}),right=rows.filter(Boolean).length,score=Math.round(right/graders.length*100),passed=score>=(window.LOMDA.pass||70);
    examResult={score:score,passed:passed,right:right,total:graders.length,rows:rows};
    SCORM.finish(score,passed);
    idx++; renderScreen();
  });
}
function renderResult(hostEl){
  var r=examResult||{score:0,passed:false,right:0,total:0,rows:[]},pass=(window.LOMDA.pass||70);
  hostEl.appendChild(el('p','eyebrow','סיום הלומדה'));
  hostEl.appendChild(el('h2',null,'עניתם נכון על '+r.right+' מתוך '+r.total+' שאלות'));
  var ring=el('div','score-ring',String(r.score));ring.style.color=r.passed?'var(--good)':'var(--bad)';hostEl.appendChild(ring);
  hostEl.appendChild(el('div','verdict '+(r.passed?'pass':'fail'),r.passed?'עברתם בהצלחה! 🎉':'לא עברתם הפעם'));
  hostEl.appendChild(el('p','lead',r.passed?('כל הכבוד — סיימתם את הלומדה ועמדתם בציון העובר ('+pass+').'):('הציון העובר הוא '+pass+'. אפשר לחזור על היחידות ולנסות שוב.')));
  var bd=el('div','breakdown');r.rows.forEach(function(ok,i){bd.appendChild(el('div','row '+(ok?'c':'w'),'<span class="mark">'+(ok?'✓':'✗')+'</span><span>שאלה '+(i+1)+': '+(ok?'נכון':'שגוי')+'</span>'));});hostEl.appendChild(bd);
  var sm=el('p',null,SCORM.live?('✓ הציון ('+r.score+') והסטטוס דווחו ל-Moodle.'):'תצוגה מקדימה: כאן הציון היה נשלח ל-Moodle (כשהלומדה תרוץ כחבילת SCORM).');sm.style.cssText='margin-top:18px;font-size:14px;color:var(--muted)';hostEl.appendChild(sm);
  var rb=el('button','btn','חזרה לתחילת הלומדה');rb.style.marginTop='16px';rb.addEventListener('click',function(){idx=0;examResult=null;renderScreen();});hostEl.appendChild(rb);
}

/* ===================== engine / navigation ===================== */
var SCREENS=(window.LOMDA&&window.LOMDA.screens)||[];
var idx=0, ctx={}, examResult=null, host=document.getElementById('screenHost');
var prevBtn=document.getElementById('prevBtn'), nextBtn=document.getElementById('nextBtn');
var actEl=document.getElementById('act'), countEl=document.getElementById('count'), pbar=document.getElementById('pbar');
if(window.LOMDA&&window.LOMDA.title){document.getElementById('barTitle').textContent=window.LOMDA.title;}

function updateNav(){
  var s=SCREENS[idx];
  prevBtn.hidden=(idx===0)||(s&&s.kind==='result');
  nextBtn.hidden=(idx>=SCREENS.length-1)||(s&&(s.kind==='exam'||s.kind==='result'));
}
function renderScreen(){
  host.innerHTML=''; ctx={needDialogue:false,dialogueDone:false,engageChart:null,learnChart:null};
  var s=SCREENS[idx];
  actEl.textContent=s.act||'';
  countEl.textContent='מסך '+(idx+1)+'/'+SCREENS.length;
  pbar.style.width=(SCREENS.length>1?(idx/(SCREENS.length-1)*100):0)+'%';
  var sec=el('section','screen'+(s.kind==='divider'?' divider':'')+(s.kind==='result'?' result':''));
  if(s.kind==='divider'){ sec.innerHTML='<div class="num">'+s.num+'</div><h2>'+s.title+'</h2><p class="sub">'+(s.sub||'')+'</p>'; }
  else if(s.kind==='exam'){ renderExam(s,sec); }
  else if(s.kind==='result'){ renderResult(sec); }
  else{
    if(s.eyebrow) sec.appendChild(el('p','eyebrow',s.eyebrow));
    if(s.title) sec.appendChild(el('h2',null,s.title));
    (s.blocks||[]).forEach(function(b){ renderBlock(b,ctx,sec); });
    if(s.question) renderQuestion(s.question,sec);
    if(s.questions) renderQuestions(s.questions,sec);
    if(s.examNote) sec.appendChild(el('div','note examnote',s.examNote));
  }
  host.appendChild(sec);
  updateNav();
  window.scrollTo({top:0,behavior:'smooth'});
}
prevBtn.addEventListener('click',function(){ if(idx>0){idx--;renderScreen();} });
nextBtn.addEventListener('click',function(){ if(idx<SCREENS.length-1){idx++;renderScreen();} });
document.getElementById('resetBtn').addEventListener('click',function(){ location.reload(); });

SCORM.init();
window.addEventListener('beforeunload',function(){ SCORM.quit(); });
if(SCREENS.length){ renderScreen(); }
else{ host.innerHTML='<section class="screen"><p>שגיאה: קובץ התוכן (content.js) לא נטען.</p></section>'; }
</script>
